[project]
name = "transaction-ledger"
version = "0.1.0"
description = "An atomic transaction ledger built with FastAPI and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
